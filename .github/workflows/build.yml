name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compress images with FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            find app/src/main/res -name "*.png" | while read -r img; do
              ffmpeg -nostdin -y -v error -i "$img" -pred mixed -compression_level 9 "${img}.tmp.png" && mv "${img}.tmp.png" "$img"
            done
          fi

      - name: Build Debug and Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare and Sign Release APK
        run: |
          mkdir -p dist

          # Copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" dist/app-debug.apk

          # Find release APK (signed or unsigned)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          # If release APK is unsigned, sign it with a release key
          if [[ "$RELEASE_APK" == *"unsigned"* ]]; then
            echo "Signing release APK with generated key..."
            keytool -genkeypair -v -keystore release.keystore -alias tinykeyboard \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=TinyKeyboard, OU=Keyboard, O=Tiny, L=World, S=World, C=US"
            
            # Find latest build-tools for zipalign & apksigner
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RELEASE_APK" dist/app-release-aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --out dist/app-release.apk dist/app-release-aligned.apk
            rm -f dist/app-release-aligned.apk release.keystore
          else
            cp "$RELEASE_APK" dist/app-release.apk
          fi

          echo "=== Built APK Sizes ==="
          ls -lh dist/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-keyboard-apks
          path: |
            dist/app-debug.apk
            dist/app-release.apk
